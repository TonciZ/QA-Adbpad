name: Release

# Manual release: builds the installers for Windows, Linux and macOS, creates the tag and
# GitHub release, and attaches them. Release notes are read from
# .github/release-notes/v<version>.md.
on:
  workflow_dispatch:
    inputs:
      delete_branches:
        description: "Space-separated branch names to delete after the release (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/.*packageVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f ".github/release-notes/v$version.md" || { echo "Missing .github/release-notes/v$version.md"; exit 1; }
          # The in-app update check compares against AppVersion.CURRENT, which is kept in sync by
          # hand. A release where the two differ would offer itself as an update forever.
          app=$(sed -n 's/.*const val CURRENT = "\([^"]*\)".*/\1/p' core/domain/main/kotlin/jp/kaleidot725/adbpad/domain/model/update/AppVersion.kt)
          test "$app" = "$version" || { echo "AppVersion.CURRENT ($app) does not match packageVersion ($version)"; exit 1; }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "17"

      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: bash
        run: |
          ./gradlew packageMsi
          mkdir dist
          cp "$(find build/compose/binaries -name '*.msi' | head -n 1)" "dist/QA-Adbpad-$VERSION.msi"

      - name: Build Linux packages
        if: matrix.name == 'linux'
        run: |
          ./gradlew packageDeb
          mkdir dist
          cp "$(find build/compose/binaries -name '*.deb' | head -n 1)" "dist/QA-Adbpad-$VERSION-linux-x64.deb"
          # Portable build for distros that do not use .deb: unpack and run bin/QA-Adbpad.
          ./gradlew createDistributable
          tar -czf "dist/QA-Adbpad-$VERSION-linux-x64.tar.gz" -C build/compose/binaries/main/app QA-Adbpad

      - name: Build macOS disk image
        if: startsWith(matrix.name, 'macos')
        run: |
          ./gradlew packageDmg
          mkdir dist
          cp "$(find build/compose/binaries -name '*.dmg' | head -n 1)" "dist/QA-Adbpad-$VERSION-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "QA-Adbpad v$VERSION" \
            --notes-file ".github/release-notes/v$VERSION.md"

      - name: Delete branches
        if: ${{ inputs.delete_branches != '' }}
        env:
          BRANCHES: ${{ inputs.delete_branches }}
        run: |
          for b in $BRANCHES; do
            git push origin --delete "$b" || echo "Could not delete $b"
          done
