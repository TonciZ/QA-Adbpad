name: Release

# Manual release: builds the Windows installer, creates the tag and GitHub release,
# and attaches the .msi. Release notes are read from .github/release-notes/v<version>.md.
on:
  workflow_dispatch:
    inputs:
      delete_branches:
        description: "Space-separated branch names to delete after the release (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Read version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'packageVersion = "\K[^"]+' build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -f ".github/release-notes/v$version.md" || { echo "Missing .github/release-notes/v$version.md"; exit 1; }

      - name: Build MSI
        shell: bash
        run: ./gradlew packageMsi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          msi=$(find build/compose/binaries -name "*.msi" | head -n 1)
          test -n "$msi" || { echo "No .msi produced"; exit 1; }
          gh release create "v$VERSION" "$msi" \
            --target "$GITHUB_SHA" \
            --title "QA-Adbpad v$VERSION" \
            --notes-file ".github/release-notes/v$VERSION.md"

      - name: Delete branches
        if: ${{ inputs.delete_branches != '' }}
        shell: bash
        env:
          BRANCHES: ${{ inputs.delete_branches }}
        run: |
          for b in $BRANCHES; do
            git push origin --delete "$b" || echo "Could not delete $b"
          done
