name: Pull request check

on:
  pull_request

# Danger posts its report (lint findings, "Big PR" warning) as PR comments,
# which the default read-only GITHUB_TOKEN is not allowed to do.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    name: Check pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
      - name: Install danger
        run: |
          gem install danger danger-junit danger-checkstyle_format
      - name: Run test
        run: |
          ./gradlew test
        continue-on-error: true
      - name: Run ktlint
        run: |
          ./gradlew ktlintCheck
        continue-on-error: true
      - name: Run danger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          danger
